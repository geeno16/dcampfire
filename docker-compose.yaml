services:
  db:
    image: postgres:16
    platform: linux/amd64
    container_name: dcampfire_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-dev:
    profiles: ["dev"]
    platform: linux/amd64
    image: dcampfire-app-dev
    container_name: dcampfire_app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
    working_dir: /workspace/backend
    command: tail -f /dev/null

  app-prod:
    profiles: ["prod"]
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: dcampfire-app-prod
    container_name: dcampfire_app_prod
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media_data:/workspace/backend/media
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
